{% extends "base.html" %}
{% block title %}Login &mdash; JobMatch AI{% endblock %}

{% block content %}
<section class="auth-wrapper">
    <form class="auth-card" method="POST" action="{{ url_for('login') }}">
        <h2>Welcome back</h2>
        <p class="muted">Log in to view your personalized job recommendations.</p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">

        <button type="submit" class="btn btn-primary btn-block">Log In</button>

        <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
    </form>
</section>
{% endblock %}
